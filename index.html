<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق حسينية الشعباوي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            padding-bottom: 90px;
        }

        /* شاشة تسجيل الدخول */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; transition: opacity 0.4s ease;
        }
        .login-box {
            background: #1a1a1a; padding: 30px; border-radius: 15px;
            border: 1px solid #1b4329; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center; width: 100%; max-width: 400px;
        }
        .login-title { color: #ffffff; font-size: 20px; margin-bottom: 25px; font-weight: bold; }
        .login-input {
            width: 100%; padding: 12px; background: #121212; border: 1px solid #333;
            color: white; border-radius: 8px; outline: none; font-size: 16px; text-align: center; margin-bottom: 15px;
        }
        .login-input:disabled, .login-btn:disabled {
            opacity: 0.5; cursor: not-allowed;
        }
        .login-btn {
            background: #1b4329; color: white; border: none; padding: 12px; border-radius: 8px;
            font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; transition: background 0.3s;
        }
        .login-btn:hover:not(:disabled) { background: #235635; }
        .login-error { color: #ff5252; font-size: 13px; margin-top: 10px; display: none; font-weight: bold; }

        /* 1. الهيدر العلوي */
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; background-color: #000000; border-bottom: 2px solid #1b4329;
        }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .back-btn { color: #2e7d32; font-size: 20px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .app-logo { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 1px solid #1b4329; }

        /* نافذة عرض اللوجو */
        .logo-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center;
        }
        .logo-modal img {
            width: 260px; height: 260px; border-radius: 50%; object-fit: cover;
            border: 4px solid #1b4329; box-shadow: 0 0 25px rgba(46, 125, 50, 0.6);
        }

        /* 2. شريط البحث */
        .search-container { padding: 12px 15px 5px 15px; background-color: #121212; }
        .search-input {
            width: 100%; padding: 10px 20px; background-color: #1e1e1e;
            border: 1px solid #333333; border-radius: 25px; color: #ffffff;
            font-size: 14px; outline: none; text-align: right;
        }
        .search-input::placeholder { color: #777777; }

        /* 3. شريط أزرار الفلترة */
        .filter-bar {
            display: flex; 
            background-color: #1b4329; 
            border-top: 1px solid #2e7d32; 
            border-bottom: 1px solid #2e7d32;
            margin-top: 10px; 
            margin-bottom: 12px;
        }
        .filter-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 11px 5px; 
            background: #1b4329; 
            border: none;
            border-left: 1px solid #2e7d32; 
            color: #ffffff; 
            font-size: 14px;
            font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .filter-btn:first-child { border-left: none; }
        .filter-btn:hover { background: #235635; }

        /* 4. تصميم الكروت الداكن */
        .video-list { padding: 0 12px 20px 12px; display: flex; flex-direction: column; gap: 12px; }
        
        .custom-card {
            background: #1a1a1a; color: #e0e0e0; border-radius: 12px; padding: 12px;
            display: flex; flex-direction: row; justify-content: space-between; align-items: flex-start;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid #2a2a2a;
            cursor: pointer; transition: background 0.2s, transform 0.15s ease;
            position: relative;
        }
        .custom-card:hover { background: #222222; }
        .custom-card:active { transform: scale(0.99); }

        .card-content-left { flex: 1; display: flex; flex-direction: column; gap: 5px; padding-left: 10px; }
        .card-header-row { display: flex; align-items: flex-start; gap: 8px; }
        .card-arrow { color: #888888; font-size: 14px; margin-top: 2px; }
        .card-title-text { font-size: 14px; font-weight: bold; color: #ffffff; line-height: 1.5; word-break: break-word; }
        .card-date-text { font-size: 13px; color: #4caf50; margin-top: 2px; font-weight: 600; }
        .card-middle-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .card-play-btn { color: #81c784; font-size: 16px; }
        .card-location-text { font-size: 12px; color: #b0b0b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-reciter-text { font-size: 12px; color: #9e9e9e; margin-top: 2px; }

        .card-actions-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .btn-card-details {
            background: #fbc02d; color: #000000; border: none;
            padding: 5px 12px; border-radius: 6px; font-size: 11px;
            font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn-card-details:hover { background: #fdd835; }

        .badge-card-type {
            background: #d32f2f; color: #ffffff; border: none;
            padding: 5px 10px; border-radius: 6px; font-size: 11px;
            font-weight: bold; display: inline-block;
        }

        .card-thumb-right {
            width: 90px; min-width: 90px; height: 90px;
            border-radius: 8px; overflow: hidden; background: #000000; margin-right: 4px;
        }
        .card-thumb-right img { width: 100%; height: 100%; object-fit: cover; }

        .playlist-header-back {
            display: flex; align-items: center; gap: 10px; background: #1b4329;
            padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; font-weight: bold;
        }

        /* نافذة عرض التفاصيل */
        .details-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2800; justify-content: center; align-items: center;
            padding: 15px;
        }
        .details-modal-card {
            background: #1e1e1e; color: #ffffff; border-radius: 16px;
            width: 100%; max-width: 450px; border: 1px solid #2e7d32;
            padding: 20px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative;
        }
        .details-modal-img {
            width: 100%; height: 180px; border-radius: 10px; object-fit: cover; border: 1px solid #333;
        }
        .details-info-item { font-size: 14px; color: #ddd; line-height: 1.6; }
        .details-info-item strong { color: #81c784; }
        .details-close-btn {
            background: #2e7d32; color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center;
            font-size: 14px;
        }

        /* 5. شريط التنقل السفلي */
        .curved-nav-wrapper {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background-color: #1b4329; z-index: 1000; display: flex;
            justify-content: space-around; align-items: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: #a3c2a8; cursor: pointer; transition: all 0.3s ease; height: 100%; text-decoration: none;
        }
        .nav-item .nav-icon {
            width: 42px; height: 42px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 20px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item .nav-text { font-size: 12px; font-weight: bold; margin-top: 2px; }
        .nav-item.active { color: #ffffff; }
        .nav-item.active .nav-icon {
            background-color: #ffffff; color: #1b4329; transform: translateY(-20px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4); border: 4px solid #1b4329; width: 50px; height: 50px; font-size: 24px;
        }
        .nav-item.active .nav-text { transform: translateY(-8px); color: #ffffff; }

        /* 6. نافذة منقي الفلاتر */
        .filter-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2500; justify-content: center; align-items: flex-end;
        }
        .filter-modal-card {
            background: #ffffff; color: #000000;
            width: 100%; max-width: 500px;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 20px 20px 25px 20px; max-height: 85vh;
            display: flex; flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .filter-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .filter-modal-title { font-size: 18px; font-weight: bold; color: #111; }
        .filter-modal-clear { color: #1b4329; font-weight: bold; cursor: pointer; font-size: 15px; }

        .filter-section-title { font-size: 14px; font-weight: bold; color: #1b4329; margin: 10px 0 5px 0; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .filter-options-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; margin-bottom: 15px; }
        .filter-option-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 15px; color: #222; cursor: pointer; }
        .filter-option-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #1b4329; cursor: pointer; }

        .filter-apply-btn {
            background: #1b4329; color: #ffffff; border: none; padding: 14px;
            border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; text-align: center;
        }

        /* المشغلات */
        .player-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; flex-direction: column; justify-content: center; align-items: center;
        }
        .player-header {
            position: absolute; top: 15px; right: 15px; left: 15px;
            display: flex; justify-content: space-between; align-items: center; z-index: 2001;
        }
        .btn-icon {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-left: 5px;
        }

        .sticky-audio-player {
            display: none; position: fixed; bottom: 72px; left: 10px; right: 10px;
            background: #1b4329; border-radius: 12px; padding: 10px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 999;
            align-items: center; justify-content: space-between; border: 1px solid #2e7d32;
        }
        .audio-info { font-size: 13px; color: #ffffff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 65%; }

        /* لوحة التحكم */
        .admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); z-index: 1500; justify-content: center; align-items: center; padding: 10px;
        }
        .admin-content {
            background: #1e1e1e; color: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 520px;
            border: 1px solid #333; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column;
        }
        .admin-nav { display: flex; gap: 4px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; flex-wrap: wrap; }
        .admin-nav button {
            flex: 1; padding: 8px 4px; background: #2a2a2a; border: 1px solid #444; color: #ccc;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; white-space: nowrap;
        }
        .admin-nav button.active { background: #4caf50; color: black; border-color: #4caf50; }
        
        /* زر قسم المحظورين */
        #navBannedBtn.active { background: #d32f2f; color: white; border-color: #d32f2f; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; color: #ccc; font-size: 13px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: #121212; border: 1px solid #444;
            color: white; border-radius: 8px; outline: none; font-size: 14px;
        }
        .btn { background: #4caf50; color: black; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-warning { background: #f57c00; color: white; }
        .btn-blue { background: #1976d2; color: white; }
        .manage-search { width: 100%; padding: 8px 12px; background: #121212; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 10px; font-size: 13px; outline: none; }
        .manage-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; background: #151515; padding: 10px; border-radius: 8px; font-size: 13px; border: 1px solid #2a2a2a; }
        
        .reorder-btn-group { display: flex; gap: 4px; }
        .btn-arrow { background: #333; color: white; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-arrow:hover { background: #555; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <div class="login-box">
            <div class="login-title">تسجيل الدخول</div>
            <input type="password" id="loginPassword" class="login-input" placeholder="أدخل كلمة المرور..." onkeypress="handleLoginKeyPress(event)">
            <button class="login-btn" id="loginSubmitBtn" onclick="checkAppPassword()">الدخول للتطبيق</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div id="main-app-content" style="display: none;">
        
        <div class="app-header">
            <div class="header-right">
                <a href="#" class="back-btn" onclick="location.reload();">❯</a>
                <img src="https://e.top4top.io/p_3874hbdrg1.jpg" class="app-logo" id="logoImg" alt="Logo" onclick="showLogoModal()">
            </div>
        </div>

        <div class="logo-modal" id="logoModal" onclick="closeLogoModal()">
            <img src="https://e.top4top.io/p_3874hbdrg1.jpg" alt="Logo Full">
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيديو أو قائمة..." oninput="searchMedia()" onkeypress="checkAdminPass(event)">
        </div>

        <div class="filter-bar" id="mainFilterBar">
            <button class="filter-btn" onclick="openFilterModal('date')"><span>📅 التاريخ والأشهر</span></button>
            <button class="filter-btn" onclick="openFilterModal('type')"><span>≡ النوع</span></button>
            <button class="filter-btn" onclick="openFilterModal('reciter')"><span>🎙️ القراء</span></button>
        </div>

        <div class="video-list" id="videoContainer">
            <p style="text-align: center; color: #888; margin-top: 20px;">جاري تحميل المحتوى أونلاين...</p>
        </div>

        <div class="details-modal-overlay" id="detailsModalOverlay">
            <div class="details-modal-card">
                <img id="detailsImg" class="details-modal-img" src="" alt="Thumbnail">
                <h3 id="detailsTitle" style="color: #ffffff; font-size: 16px; margin-top: 5px;"></h3>
                <div class="details-info-item"><strong>التاريخ:</strong> <span id="detailsDate"></span></div>
                <div class="details-info-item"><strong>المكان:</strong> <span id="detailsLocation"></span></div>
                <div class="details-info-item"><strong>القارئ:</strong> <span id="detailsReciter"></span></div>
                <div class="details-info-item"><strong>التصنيف:</strong> <span id="detailsType"></span></div>
                <button class="details-close-btn" onclick="closeDetailsModal()">إغلاق النافذة</button>
            </div>
        </div>

        <div class="filter-modal-overlay" id="filterModalOverlay">
            <div class="filter-modal-card">
                <div class="filter-modal-header">
                    <span class="filter-modal-title" id="filterModalTitle">منقي الفلتر</span>
                    <span class="filter-modal-clear" onclick="clearCurrentCategoryFilters()">مسح التحديد</span>
                </div>
                <div class="filter-options-list" id="filterOptionsList"></div>
                <button class="filter-apply-btn" onclick="applySelectedFilters()">تطبيق الفلتر</button>
            </div>
        </div>

        <div class="sticky-audio-player" id="stickyAudioPlayer">
            <div class="audio-info" id="audioTitleDisplay">جاري التشغيل...</div>
            <audio id="globalAudioPlayer" controls controlsList="nodownload" style="height: 35px; outline: none;"></audio>
            <button onclick="closeAudioPlayer()" style="background:none; border:none; color:white; font-size:16px; cursor:pointer;">✖</button>
        </div>

        <div class="curved-nav-wrapper">
            <div class="nav-item active" onclick="switchMainTab('videos', this)"><div class="nav-icon">🎬</div><div class="nav-text">الفيديوهات</div></div>
            <div class="nav-item" onclick="switchMainTab('live', this)"><div class="nav-icon">📺</div><div class="nav-text">البث المباشر</div></div>
            <div class="nav-item" onclick="switchMainTab('audio', this)"><div class="nav-icon">🎧</div><div class="nav-text">الصوتيات</div></div>
            <div class="nav-item" onclick="switchMainTab('playlists', this)"><div class="nav-icon">📑</div><div class="nav-text">قوائم التشغيل</div></div>
        </div>

        <div class="player-modal" id="playerModal">
            <div class="player-header">
                <span id="playerTitle" style="font-weight: bold; color: white;"></span>
                <div>
                    <button class="btn-icon" onclick="toggleFullscreen()">ملء الشاشة 🔲</button>
                    <button class="btn-icon" onclick="closePlayer()">إغلاق ✖</button>
                </div>
            </div>
            <video id="mainVideo" controls controlsList="nodownload" style="display:none; width: 100%; max-height: 80vh; outline: none;"></video>
            <iframe id="youtubeIframe" style="display:none; width:100%; height:80vh; border:none;" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>

        <!-- لوحة التحكم للإدمن -->
        <div class="admin-modal" id="adminModal">
            <div class="admin-content">
                <div class="admin-nav">
                    <button id="navAddBtn" class="active" onclick="switchAdminTab('add')">➕ إضافة</button>
                    <button id="navEditBtn" onclick="switchAdminTab('edit')">✏️ تعديل</button>
                    <button id="navReorderBtn" onclick="switchAdminTab('reorder')">⇄ الترتيب</button>
                    <button id="navDeleteBtn" onclick="switchAdminTab('delete')">🗑️ حذف</button>
                    <button id="navBannedBtn" onclick="switchAdminTab('banned')">🚫 المحظورين</button>
                </div>

                <div id="addEditSection">
                    <h3 id="formTitle" style="margin-top:0; color:#4caf50;">إضافة محتوى جديد</h3>
                    <input type="hidden" id="editingItemId" value="">

                    <div class="form-group">
                        <label>التبويب الرئيسي:</label>
                        <select id="mediaCategory" onchange="toggleAdminFormFields()">
                            <option value="videos">الفيديوهات (ومعها الصوتية)</option>
                            <option value="live">🔴 البث المباشر</option>
                            <option value="playlists">قوائم التشغيل</option>
                        </select>
                    </div>

                    <div id="videoSpecificFields">
                        <div class="form-group">
                            <label>النوع / التصنيف:</label>
                            <select id="mediaTypeSelect" onchange="checkCustomInput('mediaTypeSelect', 'customTypeGroup')"></select>
                        </div>
                        <div class="form-group" id="customTypeGroup" style="display:none;">
                            <input type="text" id="customTypeInput" placeholder="أدخل اسم النوع الجديد هنا...">
                        </div>

                        <div class="form-group">
                            <label>الوقت واليوم (اختياري):</label>
                            <input type="text" id="mediaTimeDay" placeholder="مثال: ليلة 10 أو صباح الجمعة">
                        </div>

                        <div class="form-group">
                            <label>الشهر الهجري:</label>
                            <select id="mediaHijriMonthSelect">
                                <option value="">بدون تحديد شهر</option>
                                <option value="شهر محرم">شهر محرم</option>
                                <option value="شهر صفر">شهر صفر</option>
                                <option value="شهر ربيع الأول">شهر ربيع الأول</option>
                                <option value="شهر ربيع الآخر">شهر ربيع الآخر</option>
                                <option value="شهر جمادى الأولى">شهر جمادى الأولى</option>
                                <option value="شهر جمادى الآخرة">شهر جمادى الآخرة</option>
                                <option value="شهر رجب">شهر رجب</option>
                                <option value="شهر شعبان">شهر شعبان</option>
                                <option value="شهر رمضان">شهر رمضان</option>
                                <option value="شهر شوال">شهر شوال</option>
                                <option value="شهر ذو القعدة">شهر ذو القعدة</option>
                                <option value="شهر ذو الحجة">شهر ذو الحجة</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>السنة الهجرية:</label>
                            <select id="mediaHijriYearSelect" onchange="checkCustomInput('mediaHijriYearSelect', 'customYearGroup')"></select>
                        </div>
                        <div class="form-group" id="customYearGroup" style="display:none;">
                            <input type="text" id="customYearInput" placeholder="أدخل السنة الهجرية الجديدة (مثال: 1448 هـ)...">
                        </div>

                        <div class="form-group">
                            <label>الموقع / المكان:</label>

    <script>
        const JSONBIN_BIN_ID = "6a79f05dda38895dfed18676"; 
        const JSONBIN_API_KEY = "$2a$10$XafrSMTB7eR.GSTbU7rCjeUZsM1YExTMdPfMlbrq3yY/113XyM9YC";

        let cachedMediaItems = [];
        let customTypesList = [];
        let customRecitersList = [];
        let customYearsList = [];
        let bannedDevicesList = []; // مصفوفة الأجهزة المحظورة

        let currentCategory = 'videos';
        let activePlaylistId = null;

        let selectedFilters = { months: [], years: [], types: [], reciters: [] };
        let currentActiveFilterType = null;

        // --- نظام حظر الأجهزة ---
        function getDeviceId() {
            let id = localStorage.getItem('app_device_id');
            if (!id) {
                id = 'DEV-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('app_device_id', id);
            }
            return id;
        }

        function getDeviceName() {
            const ua = navigator.userAgent;
            let name = "جهاز غير معروف";
            if (ua.includes('Android')) name = "Android Device";
            else if (ua.includes('iPhone')) name = "iPhone";
            else if (ua.includes('Windows')) name = "Windows PC";
            else if (ua.includes('Mac OS')) name = "Mac";
            return name + " (" + getDeviceId().substring(0,8) + ")";
        }

        function showLoginError(msg, isPermanent = false) {
            const errorMsg = document.getElementById('loginError');
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
            if (isPermanent) {
                document.getElementById('loginPassword').disabled = true;
                document.getElementById('loginSubmitBtn').disabled = true;
            }
        }

        function banCurrentDevice() {
            const deviceId = getDeviceId();
            if (!bannedDevicesList.some(d => d.id === deviceId)) {
                bannedDevicesList.push({
                    id: deviceId,
                    name: getDeviceName(),
                    date: new Date().toLocaleDateString('ar-IQ')
                });
                syncOnlineData(() => {
                    showLoginError("تم حظر هذا الجهاز بسبب تجاوز عدد المحاولات المسموحة! 🚫", true);
                });
            } else {
                showLoginError("تم حظر هذا الجهاز بسبب تجاوز عدد المحاولات المسموحة! 🚫", true);
            }
        }

        // دالة فحص وتأكيد كلمة المرور للدخول للتطبيق
        function checkAppPassword() {
            const deviceId = getDeviceId();
            if (bannedDevicesList.some(d => d.id === deviceId)) {
                showLoginError("هذا الجهاز محظور من الدخول للتطبيق! 🚫", true);
                return;
            }

            const inputVal = document.getElementById('loginPassword').value;
            const _0xkey = ['A','l',' ','S','h','a','b','a','w','i',' ','H','u','s','s','e','i','n','i','y',' ','M','u','h','a','m','m','a','d',' ','H','a','s','s','a','n',' ','A','b','d','u','l',' ','A','m','i','r','6','4','9','4','8','8','4','$','+','&','&',')',' ','$','-',')','_','-','_','(','_','+','+','$',')','+','$',')','-','_','»','-','«','•','•','«','•',')','_','/','/','♡','»','♡','»'];
            
            if (inputVal === _0xkey.join('')) {
                localStorage.setItem('failed_attempts', '0'); // تصفير المحاولات عند النجاح
                const loginScreen = document.getElementById('login-screen');
                loginScreen.style.opacity = '0';
                setTimeout(() => {
                    loginScreen.style.display = 'none';
                    document.getElementById('main-app-content').style.display = 'block';
                }, 400); 
            } else {
                let attempts = parseInt(localStorage.getItem('failed_attempts') || '0');
                attempts++;
                localStorage.setItem('failed_attempts', attempts.toString());
                
                if (attempts >= 10) {
                    banCurrentDevice();
                } else {
                    const remaining = 10 - attempts;
                    showLoginError(`كلمة المرور غير صحيحة! متبقي لك ${remaining} محاولات قبل الحظر.`);
                }
            }
        }

        function handleLoginKeyPress(event) {
            if (event.key === 'Enter') checkAppPassword();
        }

        function fetchOnlineData(callback) {
            fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            })
            .then(res => res.json())
            .then(data => {
                const root = data.record;
                if (Array.isArray(root)) {
                    cachedMediaItems = root;
                } else {
                    cachedMediaItems = root.items || [];
                    customTypesList = root.customTypes || [];
                    customRecitersList = root.customReciters || [];
                    customYearsList = root.customYears || [];
                    bannedDevicesList = root.bannedDevices || [];
                }

                // التأكد فوراً إذا كان الجهاز محظوراً عند تحميل البيانات
                if (bannedDevicesList.some(d => d.id === getDeviceId())) {
                    showLoginError("هذا الجهاز محظور من الدخول للتطبيق! 🚫", true);
                }

                cachedMediaItems.forEach(item => {
                    if (item.type && item.type.trim() && !customTypesList.includes(item.type.trim())) customTypesList.push(item.type.trim());
                    if (item.year && item.year.trim() && !customYearsList.includes(item.year.trim())) customYearsList.push(item.year.trim());
                    if (item.reciter && item.reciter.trim() && !customRecitersList.includes(item.reciter.trim())) customRecitersList.push(item.reciter.trim());
                });

                populatePlaylistDropdown();
                populateAdminDropdowns();
                loadMedia();
                if (callback) callback();
            })
            .catch(err => {
                console.error("خطأ في الاتصال:", err);
                document.getElementById('videoContainer').innerHTML = '<p style="text-align: center; color: red;">عذراً، فشل الاتصال بالسيرفر!</p>';
            });
        }

        function syncOnlineData(callback) {
            const dataToSave = {
                items: cachedMediaItems,
                customTypes: customTypesList,
                customReciters: customRecitersList,
                customYears: customYearsList,
                bannedDevices: bannedDevicesList
            };

            fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
                body: JSON.stringify(dataToSave)
            })
            .then(res => res.json())
            .then(() => fetchOnlineData(callback))
            .catch(err => alert("حدث خطأ أثناء حفظ البيانات بالسيرفر!"));
        }

        window.onload = function() { 
            fetchOnlineData(); 
            setupMediaSessionHandlers();
        };

        // --- باقي دوال عرض التطبيق ---
        function populatePlaylistDropdown() {
            const select = document.getElementById('mediaPlaylistId');
            if (!select) return;
            select.innerHTML = '<option value="">بدون قائمة تشغيل</option>';
            const playlists = cachedMediaItems.filter(i => i.category === 'playlists');
            playlists.forEach(pl => { select.innerHTML += `<option value="${pl.id}">${pl.title}</option>`; });
        }

        function populateAdminDropdowns() {
            const typeSelect = document.getElementById('mediaTypeSelect');
            const reciterSelect = document.getElementById('mediaReciterSelect');
            const yearSelect = document.getElementById('mediaHijriYearSelect');

            typeSelect.innerHTML = '<option value="">بدون تحديد تصنيف</option>' + 
                customTypesList.map(t => `<option value="${t}">${t}</option>`).join('') + '<option value="__NEW__">➕ إضافة نوع جديد...</option>';

            reciterSelect.innerHTML = '<option value="">بدون تحديد قارئ</option>' + 
                customRecitersList.map(r => `<option value="${r}">${r}</option>`).join('') + '<option value="__NEW__">➕ إضافة قارئ جديد...</option>';

            yearSelect.innerHTML = '<option value="">بدون تحديد سنة</option>' + 
                customYearsList.map(y => `<option value="${y}">${y}</option>`).join('') + '<option value="__NEW__">➕ إضافة سنة جديدة...</option>';
        }

        function checkCustomInput(selectId, groupClass) {
            document.getElementById(groupClass).style.display = (document.getElementById(selectId).value === '__NEW__') ? 'block' : 'none';
        }

        function showLogoModal() { document.getElementById('logoModal').style.display = 'flex'; }
        function closeLogoModal() { document.getElementById('logoModal').style.display = 'none'; }

        function switchMainTab(category, elem) {
            currentCategory = category;
            activePlaylistId = null;
            document.querySelectorAll('.curved-nav-wrapper .nav-item').forEach(tab => tab.classList.remove('active'));
            elem.classList.add('active');
            document.getElementById('mainFilterBar').style.display = (category === 'videos' || category === 'audio') ? 'flex' : 'none';
            loadMedia();
        }

        function openDetailsModal(itemId, event) {
            if (event) event.stopPropagation();
            const item = cachedMediaItems.find(i => i.id === itemId);
            if (!item) return;

            const ytId = getYoutubeId(item.videoUrl);
            let thumbSrc = item.thumbUrl;
            if (!thumbSrc && ytId) thumbSrc = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
            if (!thumbSrc) thumbSrc = 'https://via.placeholder.com/150x150/1a1a1a/ffffff?text=شعار';

            document.getElementById('detailsImg').src = thumbSrc;
            document.getElementById('detailsTitle').innerText = item.title;
            document.getElementById('detailsDate').innerText = item.dateText || "غير محدد";
            document.getElementById('detailsLocation').innerText = item.location || "غير محدد";
            document.getElementById('detailsReciter').innerText = item.reciter || "غير محدد";
            document.getElementById('detailsType').innerText = item.type || "عام";
            document.getElementById('detailsModalOverlay').style.display = 'flex';
        }

        function closeDetailsModal() { document.getElementById('detailsModalOverlay').style.display = 'none'; }

        function updateMediaSession(item, thumbSrc) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: item.title, artist: item.reciter || 'حسينية الشعباوي',
                    album: item.location || 'تطبيق حسينية الشعباوي', artwork: [{ src: thumbSrc, sizes: '512x512', type: 'image/png' }]
                });
            }
        }

        function setupMediaSessionHandlers() {
            if ('mediaSession' in navigator) {
                const audioPlayer = document.getElementById('globalAudioPlayer');
                navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
                navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
            }
        }

        function openFilterModal(type) {
            currentActiveFilterType = type;
            const overlay = document.getElementById('filterModalOverlay');
            const titleElem = document.getElementById('filterModalTitle');
            const optionsList = document.getElementById('filterOptionsList');
            optionsList.innerHTML = '';

            if (type === 'date') {
                titleElem.innerText = 'منقي الأشهر والسنوات الهجرية';
                const defaultMonths = ["شهر محرم", "شهر صفر", "شهر ربيع الأول", "شهر ربيع الآخر", "شهر جمادى الأولى", "شهر جمادى الآخرة", "شهر رجب", "شهر شعبان", "شهر رمضان", "شهر شوال", "شهر ذو القعدة", "شهر ذو الحجة"];
                
                let monthSec = document.createElement('div'); monthSec.className = 'filter-section-title'; monthSec.innerText = '🌙 اختر الشهر الهجري:'; optionsList.appendChild(monthSec);
                defaultMonths.forEach(m => {
                    const isChecked = selectedFilters.months.includes(m);
                    optionsList.innerHTML += `<label class="filter-option-item"><span>${m}</span><input type="checkbox" class="month-cb" value="${m}" ${isChecked ? 'checked' : ''}></label>`;
                });

                let yearSec = document.createElement('div'); yearSec.className = 'filter-section-title'; yearSec.innerText = '📅 اختر السنة الهجرية:'; optionsList.appendChild(yearSec);
                if (customYearsList.length === 0) {
                    optionsList.innerHTML += `<p style="color:#777; font-size:13px; padding:5px 0;">لم تقم بإضافة أي سنة هجرية بعد.</p>`;
                } else {
                    customYearsList.forEach(y => {
                        const isChecked = selectedFilters.years.includes(y);
                        optionsList.innerHTML += `<label class="filter-option-item"><span>${y}</span><input type="checkbox" class="year-cb" value="${y}" ${isChecked ? 'checked' : ''}></label>`;

            } else if (type === 'type') {
                titleElem.innerText = 'منقي التصنيف والأنواع';
                if (customTypesList.length === 0) optionsList.innerHTML = '<p style="color:#777; font-size:13px; text-align:center; padding:15px 0;">لم تقم بإضافة أي تصنيف بعد.</p>';
                else {
                    customTypesList.forEach(val => {
                        const isChecked = selectedFilters.types.includes(val);
                        optionsList.innerHTML += `<label class="filter-option-item"><span>${val}</span><input type="checkbox" class="type-cb" value="${val}" ${isChecked ? 'checked' : ''}></label>`;
                    });

            } else if (type === 'reciter') {
                titleElem.innerText = 'منقي القراء والرواديد';
                if (customRecitersList.length === 0) optionsList.innerHTML = '<p style="color:#777; font-size:13px; text-align:center; padding:15px 0;">لم تقم بإضافة أي رادود بعد.</p>';
                else {
                    customRecitersList.forEach(val => {
                        const isChecked = selectedFilters.reciters.includes(val);
                        optionsList.innerHTML += `<label class="filter-option-item"><span>${val}</span><input type="checkbox" class="reciter-cb" value="${val}" ${isChecked ? 'checked' : ''}></label>`;
                    });
                }
            }
            overlay.style.display = 'flex';
        }

        function clearCurrentCategoryFilters() {
            if (currentActiveFilterType === 'date') { selectedFilters.months = []; selectedFilters.years = []; }
            else if (currentActiveFilterType === 'type') selectedFilters.types = [];
            else if (currentActiveFilterType === 'reciter') selectedFilters.reciters = [];
            openFilterModal(currentActiveFilterType);
        }

        function applySelectedFilters() {
            if (currentActiveFilterType === 'date') {
                selectedFilters.months = Array.from(document.querySelectorAll('.month-cb:checked')).map(cb => cb.value);
                selectedFilters.years = Array.from(document.querySelectorAll('.year-cb:checked')).map(cb => cb.value);
            } else if (currentActiveFilterType === 'type') {
                selectedFilters.types = Array.from(document.querySelectorAll('.type-cb:checked')).map(cb => cb.value);
            } else if (currentActiveFilterType === 'reciter') {
                selectedFilters.reciters = Array.from(document.querySelectorAll('.reciter-cb:checked')).map(cb => cb.value);

            document.getElementById('filterModalOverlay').style.display = 'none';

            const cat = document.getElementById('mediaCategory').value;
            const extraFields = document.getElementById('videoSpecificFields');
            const audioGroup = document.getElementById('audioUrlGroup');
            const videoGroup = document.getElementById('videoUrlGroup');
            const videoLabel = document.getElementById('videoUrlLabel');
            const titleLabel = document.getElementById('titleLabel');
            const playlistGroup = document.getElementById('playlistSelectGroup');

            populatePlaylistDropdown(); populateAdminDropdowns();
            extraFields.style.display = (cat === 'videos') ? 'block' : 'none';

            if (cat === 'videos') {
                videoGroup.style.display = 'block'; videoLabel.innerText = 'رابط الفيديو:';
                audioGroup.style.display = 'block'; playlistGroup.style.display = 'block';
                titleLabel.innerText = 'العنوان الرئيسي للمجلس / المقطع:';

                videoGroup.style.display = 'none'; audioGroup.style.display = 'none'; playlistGroup.style.display = 'none';

            } else {
                videoGroup.style.display = 'block'; videoLabel.innerText = 'رابط البث المباشر:';
                audioGroup.style.display = 'none'; playlistGroup.style.display = 'none';
                titleLabel.innerText = 'عنوان البث المباشر:';
            }

        function buildFullDateText(timeDay, month, year) {
            let parts = [];
            if (timeDay) parts.push(timeDay.trim());
            if (month) parts.push(`من ${month.trim()}`);
            if (year) { let y = year.trim(); if (!y.includes('هـ')) y += ' هـ'; parts.push(y); }
            return parts.join(' ');
        }

            if (event.key === "Enter") {

                    document.getElementById('adminModal').style.display = 'flex';
                    document.getElementById('searchInput').value = '';
                    switchAdminTab('add');

                    });
                } else {
                    alert("كلمة سر فك الحظر خاطئة!");
                }
            }
        }

        function switchAdminTab(tab) {
            document.getElementById('navAddBtn').className = (tab === 'add') ? 'active' : '';
            document.getElementById('navEditBtn').className = (tab === 'edit') ? 'active' : '';
            document.getElementById('navReorderBtn').className = (tab === 'reorder') ? 'active' : '';
            document.getElementById('navDeleteBtn').className = (tab === 'delete') ? 'active' : '';
            document.getElementById('navBannedBtn').className = (tab === 'banned') ? 'active' : '';

            document.getElementById('addEditSection').style.display = (tab === 'add') ? 'block' : 'none';
            document.getElementById('editSection').style.display = (tab === 'edit') ? 'block' : 'none';
            document.getElementById('reorderSection').style.display = (tab === 'reorder') ? 'block' : 'none';
            document.getElementById('deleteSection').style.display = (tab === 'delete') ? 'block' : 'none';
            document.getElementById('bannedSection').style.display = (tab === 'banned') ? 'block' : 'none';

            if (tab === 'add') toggleAdminFormFields();
            if (tab === 'edit') filterManageList('edit');
            if (tab === 'reorder') renderReorderList();
            if (tab === 'delete') filterManageList('delete');
            if (tab === 'banned') renderBannedList();
        }

        let tempReorderArray = [];
        function renderReorderList() {
            const cat = document.getElementById('reorderCategorySelect').value;
            const container = document.getElementById('reorderListContainer');
            container.innerHTML = '';

            if (cat === 'videos' || cat === 'live' || cat === 'playlists') tempReorderArray = cachedMediaItems.filter(i => i.category === cat);
            else if (cat === 'types') tempReorderArray = [...customTypesList];
            else if (cat === 'reciters') tempReorderArray = [...customRecitersList];
            else if (cat === 'years') tempReorderArray = [...customYearsList];

            if (tempReorderArray.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; padding:10px;">لا يوجد عناصر للترتيب.</p>';
                return;
            }
            tempReorderArray.forEach((item, index) => {
                const title = typeof item === 'string' ? item : item.title;
                const div = document.createElement('div');
                div.className = 'manage-item';
                div.innerHTML = `
                    <span>${index + 1}. ${title}</span>
                    <div class="reorder-btn-group">
                        <button class="btn-arrow" onclick="moveReorderItem(${index}, -1)">▲ للأعلى</button>
                        <button class="btn-arrow" onclick="moveReorderItem(${index}, 1)">▼ للأسفل</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function moveReorderItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= tempReorderArray.length) return;
            const temp = tempReorderArray[index];
            tempReorderArray[index] = tempReorderArray[newIndex];
            tempReorderArray[newIndex] = temp;
            renderReorderList();
        }

        function saveNewOrder() {
            const cat = document.getElementById('reorderCategorySelect').value;
            if (cat === 'videos' || cat === 'live' || cat === 'playlists') {
                const otherItems = cachedMediaItems.filter(i => i.category !== cat);
                cachedMediaItems = [...tempReorderArray, ...otherItems];
            } else if (cat === 'types') customTypesList = [...tempReorderArray];
            else if (cat === 'reciters') customRecitersList = [...tempReorderArray];
            else if (cat === 'years') customYearsList = [...tempReorderArray];
            syncOnlineData(() => alert("تم حفظ الترتيب الجديد بنجاح أونلاين! 🚀"));
        }

        function getYoutubeId(url) {
            if (!url) return null;
            if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
            if (url.includes('youtube.com/watch')) return new URLSearchParams(url.split('?')[1]).get('v');
            if (url.includes('youtube.com/embed/')) return url.split('youtube.com/embed/')[1].split('?')[0];
            return null;
        }

        function saveMedia() {
            const editId = document.getElementById('editingItemId').value;
            const category = document.getElementById('mediaCategory').value;
            const title = document.getElementById('mediaTitle').value.trim();
            let thumbUrl = document.getElementById('thumbUrl').value.trim();
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const audioUrl = document.getElementById('audioUrl').value.trim();
            const playlistId = document.getElementById('mediaPlaylistId').value;

            if (!title) { alert('يرجى إدخال العنوان!'); return; }
            if (category !== 'playlists' && !videoUrl) { alert('يرجى إضافة الرابط المطلوب!'); return; }

            let type = '', timeDay = '', month = '', year = '', location = '', reciter = '', fullDateText = '';

            if (category === 'videos') {
                const typeSel = document.getElementById('mediaTypeSelect').value;
                type = (typeSel === '__NEW__') ? document.getElementById('customTypeInput').value.trim() : typeSel;
                if (type && !customTypesList.includes(type)) customTypesList.push(type);

                timeDay = document.getElementById('mediaTimeDay').value.trim();
                month = document.getElementById('mediaHijriMonthSelect').value;

                const yearSel = document.getElementById('mediaHijriYearSelect').value;
                year = (yearSel === '__NEW__') ? document.getElementById('customYearInput').value.trim() : yearSel;
                if (year && !customYearsList.includes(year)) customYearsList.push(year);

                location = document.getElementById('mediaLocation').value.trim() || 'حسينية الشعباوي في البصرة';

                const reciterSel = document.getElementById('mediaReciterSelect').value;
                reciter = (reciterSel === '__NEW__') ? document.getElementById('customReciterInput').value.trim() : reciterSel;
                if (reciter && !customRecitersList.includes(reciter)) customRecitersList.push(reciter);

                fullDateText = buildFullDateText(timeDay, month, year);
            }

            const ytId = getYoutubeId(videoUrl);
            if (!thumbUrl && ytId) thumbUrl = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
            document.getElementById('saveBtn').innerText = "جاري الحفظ أونلاين...";

            if (editId) {
                const existing = cachedMediaItems.find(i => i.id === parseInt(editId));
                if (existing) {
                    existing.category = category; existing.type = type; existing.timeDay = timeDay;
                    existing.month = month; existing.year = year; existing.title = title;
                    existing.dateText = fullDateText; existing.location = location; existing.reciter = reciter;
                    existing.thumbUrl = thumbUrl; existing.videoUrl = videoUrl; existing.audioUrl = audioUrl;
                    existing.playlistId = playlistId ? parseInt(playlistId) : null;
                }
            } else {
                cachedMediaItems.unshift({
                    id: Date.now(), category: category, type: type, timeDay: timeDay, month: month,
                    year: year, title: title, dateText: fullDateText, location: location,
                    reciter: reciter, thumbUrl: thumbUrl, videoUrl: videoUrl, audioUrl: audioUrl,
                    playlistId: playlistId ? parseInt(playlistId) : null
                });
            }

            syncOnlineData(() => {
                resetAdminForm(); closeAdmin(); alert("تم النشر بنجاح! 🚀");
            });
        }

        function resetAdminForm() {
            document.getElementById('editingItemId').value = "";
            document.getElementById('mediaCategory').value = "videos";
            document.getElementById('customTypeGroup').style.display = "none";
            document.getElementById('customReciterGroup').style.display = "none";
            document.getElementById('customYearGroup').style.display = "none";
            document.getElementById('mediaTimeDay').value = "";
            document.getElementById('mediaTitle').value = "";
            document.getElementById('mediaLocation').value = "";
            document.getElementById('customTypeInput').value = "";
            document.getElementById('customReciterInput').value = "";
            document.getElementById('customYearInput').value = "";
            document.getElementById('thumbUrl').value = "";
            document.getElementById('videoUrl').value = "";
            document.getElementById('audioUrl').value = "";
            document.getElementById('mediaPlaylistId').value = "";
            document.getElementById('formTitle').innerText = "إضافة محتوى جديد";
            document.getElementById('saveBtn').innerText = "نشر أونلاين فوراً ⚡";
            document.getElementById('cancelEditBtn').style.display = "none";
            toggleAdminFormFields();
        }

        function openPlaylist(playlistId) { activePlaylistId = playlistId; loadMedia(); }

        function loadMedia(searchQuery = '') {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            if (currentCategory === 'playlists' && activePlaylistId) {
                const pl = cachedMediaItems.find(i => i.id === activePlaylistId);
                const backBtn = document.createElement('div');
                backBtn.className = 'playlist-header-back';
                backBtn.innerHTML = `<span>❯ العودة لقوائم التشغيل</span> <span style="margin-right:auto; color:#a3c2a8;">${pl ? pl.title : ''}</span>`;
                backBtn.onclick = () => { activePlaylistId = null; loadMedia(); };
                container.appendChild(backBtn);

                let items = cachedMediaItems.filter(item => item.playlistId === activePlaylistId);
                if (items.length === 0) { container.innerHTML += '<p style="text-align: center; color: #888; margin-top: 30px;">لا توجد فيديوهات في هذه القائمة.</p>'; return; }
                items.forEach(item => renderCard(item, container));
                return;
            }

            let items = [];
            if (currentCategory === 'audio') items = cachedMediaItems.filter(item => item.audioUrl && item.audioUrl.trim() !== '');
            else items = cachedMediaItems.filter(item => (item.category || 'videos') === currentCategory);

            if (currentCategory === 'videos' || currentCategory === 'audio') {
                items = items.filter(i => {
                    const matchesMonth = selectedFilters.months.length === 0 || (i.month && selectedFilters.months.includes(i.month)) || (i.dateText && selectedFilters.months.some(m => i.dateText.includes(m)));
                    const matchesYear = selectedFilters.years.length === 0 || (i.year && selectedFilters.years.includes(i.year)) || (i.dateText && selectedFilters.years.some(y => i.dateText.includes(y)));
                    const matchesType = selectedFilters.types.length === 0 || selectedFilters.types.includes(i.type);
                    const matchesReciter = selectedFilters.reciters.length === 0 || selectedFilters.reciters.includes(i.reciter);
                    return matchesMonth && matchesYear && matchesType && matchesReciter;
                });
            }

            if (searchQuery) items = items.filter(i => i.title.toLowerCase().includes(searchQuery.toLowerCase()) || (i.reciter && i.reciter.toLowerCase().includes(searchQuery.toLowerCase())));

            if (items.length === 0) { container.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">لا يوجد محتوى يطابق الفلتر أو البحث الحالي.</p>'; return; }
            items.forEach(item => renderCard(item, container));
        }

        function renderCard(item, container) {
            const card = document.createElement('div');
            card.className = 'custom-card';

            const ytId = getYoutubeId(item.videoUrl);
            let thumbSrc = item.thumbUrl;
            if (!thumbSrc && ytId) thumbSrc = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
            if (!thumbSrc) thumbSrc = 'https://via.placeholder.com/150x150/1a1a1a/ffffff?text=شعار';

            if (item.category === 'playlists') {
                const count = cachedMediaItems.filter(i => i.playlistId === item.id).length;
                card.innerHTML = `<div class="card-content-left"><div class="card-header-row"><span class="card-arrow">📑</span><div class="card-title-text">${item.title}</div></div><div class="card-date-text">تضم ${count} فيديو</div></div><div class="card-thumb-right"><img src="${thumbSrc}" loading="lazy" alt="thumbnail"></div>`;
                card.onclick = () => openPlaylist(item.id);
            } else {
                const typeLabel = currentCategory === 'audio' ? 'صوتية 🎧' : 'فيديو 🎬';
                card.innerHTML = `<div class="card-content-left"><div class="card-header-row"><span class="card-arrow">⌄</span><div class="card-title-text">${item.title}</div></div>${item.dateText ? `<div class="card-date-text">${item.dateText}</div>` : ''}<div class="card-middle-row"><span class="card-play-btn">${currentCategory === 'audio' ? '🎧' : '►'}</span>${item.location ? `<div class="card-location-text">${item.location}</div>` : ''}</div>${item.reciter ? `<div class="card-reciter-text">القارئ: ${item.reciter}</div>` : ''}<div class="card-actions-row"><button class="btn-card-details" onclick="openDetailsModal(${item.id}, event)">عرض التفاصيل 👁️</button><span class="badge-card-type">${typeLabel}</span></div></div><div class="card-thumb-right"><img src="${thumbSrc}" loading="lazy" alt="thumbnail"></div>`;
                card.onclick = () => { if (currentCategory === 'audio') playBackgroundAudio(item); else playVideo(item); };
            }
            container.appendChild(card);
        }

        function playBackgroundAudio(item) {
            const ytId = getYoutubeId(item.videoUrl);
            let thumbSrc = item.thumbUrl || (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : 'https://e.top4top.io/p_3874hbdrg1.jpg');
            document.getElementById('audioTitleDisplay').innerText = item.title;
            const audioPlayer = document.getElementById('globalAudioPlayer');
            audioPlayer.src = item.audioUrl || item.videoUrl;
            document.getElementById('stickyAudioPlayer').style.display = 'flex';
            updateMediaSession(item, thumbSrc); audioPlayer.play();
        }

        function closeAudioPlayer() {
            document.getElementById('globalAudioPlayer').pause();
            document.getElementById('stickyAudioPlayer').style.display = 'none';
        }

        function playVideo(item) {
            if (!item.videoUrl) return;
            document.getElementById('playerTitle').innerText = item.title;
            const ytId = getYoutubeId(item.videoUrl);
            const videoElem = document.getElementById('mainVideo');
            const iframeElem = document.getElementById('youtubeIframe');

            if (ytId) { videoElem.style.display = 'none'; iframeElem.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1`; iframeElem.style.display = 'block'; }
            else { iframeElem.src = ''; iframeElem.style.display = 'none'; videoElem.src = item.videoUrl; videoElem.style.display = 'block'; videoElem.play(); }
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('mainVideo').pause();
            document.getElementById('mainVideo').src = '';
            document.getElementById('youtubeIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        function toggleFullscreen() {
            const videoElem = document.getElementById('mainVideo');
            const iframeElem = document.getElementById('youtubeIframe');
            const target = videoElem.style.display !== 'none' ? videoElem : iframeElem;
            if (target.requestFullscreen) target.requestFullscreen();
        }

        function filterManageList(type) {
            const isEdit = type === 'edit';
            const query = (document.getElementById(isEdit ? 'editSearchInput' : 'deleteSearchInput').value || '').toLowerCase();
            const container = document.getElementById(isEdit ? 'editListContainer' : 'deleteListContainer');
            container.innerHTML = '';

            if (isEdit) {
                cachedMediaItems.filter(i => i.title.toLowerCase().includes(query)).forEach(item => {
                    const div = document.createElement('div'); div.className = 'manage-item';
                    div.innerHTML = `<span>[${item.category}] ${item.title}</span><button class="btn-warning" onclick="prepareEdit(${item.id})">تعديل ✏️</button>`; container.appendChild(div);
                });
            } else {
                const deleteCat = document.getElementById('deleteCategorySelect').value;
                if (deleteCat === 'items') {
                    cachedMediaItems.filter(i => i.title.toLowerCase().includes(query)).forEach(item => {
                        const div = document.createElement('div'); div.className = 'manage-item';
                        div.innerHTML = `<span>[${item.category}] ${item.title}</span><button class="btn-danger" onclick="deleteItem(${item.id}, 'items')">حذف 🗑️</button>`; container.appendChild(div);
                    });
                } else if (deleteCat === 'types') {
                    customTypesList.filter(t => t.toLowerCase().includes(query)).forEach(typeItem => {
                        const div = document.createElement('div'); div.className = 'manage-item';
                        div.innerHTML = `<span>${typeItem}</span><button class="btn-danger" onclick="deleteItem('${typeItem}', 'types')">حذف 🗑️</button>`; container.appendChild(div);
                    });
                } else if (deleteCat === 'reciters') {
                    customRecitersList.filter(r => r.toLowerCase().includes(query)).forEach(reciterItem => {
                        const div = document.createElement('div'); div.className = 'manage-item';
                        div.innerHTML = `<span>${reciterItem}</span><button class="btn-danger" onclick="deleteItem('${reciterItem}', 'reciters')">حذف 🗑️</button>`; container.appendChild(div);
                    });
                } else if (deleteCat === 'years') {
                    customYearsList.filter(y => y.toLowerCase().includes(query)).forEach(yearItem => {
                        const div = document.createElement('div'); div.className = 'manage-item';
                        div.innerHTML = `<span>${yearItem}</span><button class="btn-danger" onclick="deleteItem('${yearItem}', 'years')">حذف 🗑️</button>`; container.appendChild(div);
                    });
                }
            }
        }

        function prepareEdit(id) {
            const item = cachedMediaItems.find(i => i.id === id);
            if (!item) return;

            if (item.type && item.type.trim() && !customTypesList.includes(item.type.trim())) customTypesList.push(item.type.trim());
            if (item.year && item.year.trim() && !customYearsList.includes(item.year.trim())) customYearsList.push(item.year.trim());
            if (item.reciter && item.reciter.trim() && !customRecitersList.includes(item.reciter.trim())) customRecitersList.push(item.reciter.trim());

            document.getElementById('editingItemId').value = item.id;
            document.getElementById('mediaCategory').value = item.category || "videos";
            toggleAdminFormFields();

            document.getElementById('mediaTypeSelect').value = item.type || "";
            document.getElementById('mediaTimeDay').value = item.timeDay || "";
            document.getElementById('mediaHijriMonthSelect').value = item.month || "";
            document.getElementById('mediaHijriYearSelect').value = item.year || "";
            document.getElementById('mediaTitle').value = item.title;
            document.getElementById('mediaLocation').value = item.location || "";
            document.getElementById('mediaReciterSelect').value = item.reciter || "";
            document.getElementById('thumbUrl').value = item.thumbUrl || "";
            document.getElementById('videoUrl').value = item.videoUrl || "";
            document.getElementById('audioUrl').value = item.audioUrl || "";
            document.getElementById('mediaPlaylistId').value = item.playlistId || "";
            
            document.getElementById('formTitle').innerText = "✏️ تعديل المحتوى";
            document.getElementById('saveBtn').innerText = "حفظ التعديلات ⚡";
            document.getElementById('cancelEditBtn').style.display = "block";
            switchAdminTab('add');
        }

        function deleteItem(target, targetType) {
            if (confirm('هل أنت متأكد من حذف هذا العنصر نهائياً؟')) {
                if (targetType === 'items') cachedMediaItems = cachedMediaItems.filter(i => i.id !== target);
                else if (targetType === 'types') customTypesList = customTypesList.filter(t => t !== target);
                else if (targetType === 'reciters') customRecitersList = customRecitersList.filter(r => r !== target);
                else if (targetType === 'years') customYearsList = customYearsList.filter(y => y !== target);
                syncOnlineData(() => filterManageList('delete'));
            }
        }

        function searchMedia() {
            const query = document.getElementById('searchInput').value.trim();
            if (query !== 'kokoko') loadMedia(query);
        }
    </script>
</body>
</html>
