<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>تطبيق الأذان</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        button { background: #2e7d32; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-size: 16px; margin: 10px 0; width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h3 id="time-status">جاري تحديد الموقع...</h3>
    <button id="playBtn">تشغيل الأذان</button>
    <div id="log"></div>
</div>

<script>
    const audio = new Audio('https://www.islamcan.com/audio/adhan/azan1.mp3');
    const playBtn = document.getElementById('playBtn');

    // تفعيل الـ Service Worker (مهم جداً)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    // منطق تشغيل الصوت والتحكم
    playBtn.addEventListener('click', () => {
        audio.play().then(() => {
            setupMediaSession();
        }).catch(err => alert("يجب التفاعل مع الصفحة أولاً"));
    });

    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'أذان الفجر',
                artist: 'تطبيق الأذان الذكي',
                artwork: [{ src: 'https://cdn-icons-png.flaticon.com/512/3659/3659738.png', sizes: '512x512', type: 'image/png' }]
            });

            // هذا الجزء هو المسؤول عن إظهار الشريط في الإشعارات
            navigator.mediaSession.playbackState = 'playing';

            navigator.mediaSession.setActionHandler('play', () => audio.play());
            navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        }
    }

    // جلب المواقيت
    navigator.geolocation.getCurrentPosition(pos => {
        fetch(`https://api.aladhan.com/v1/timings?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&method=4`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('time-status').innerText = "تم تحديد المواقيت بنجاح";
                console.log(data.data.timings);
            });
    });
</script>
</body>
</html>
